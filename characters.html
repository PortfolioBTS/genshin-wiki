<!doctype html>
<html lang="ru">
  <head>
    <!-- include:head -->
    <title>Персонажи — Genshin Wiki</title>
    <meta
      name="description"
      content="Все играбельные персонажи Genshin Impact с фильтрами по стихии, редкости, оружию и региону."
    />
  </head>
  <body>
    <!-- include:header -->
    <main id="main">
      <div class="page-hero">
        <h1>⚔️ Персонажи</h1>
        <p>Все играбельные герои Тейвата — фильтры по стихии, редкости, оружию и региону</p>
      </div>
      <div class="filter-bar">
        <div class="filter-groups" id="filter-groups"></div>
        <div class="filter-tools">
          <label class="visually-hidden" for="q">Поиск персонажа</label>
          <input
            class="search-input"
            id="q"
            type="search"
            placeholder="Имя, титул, регион…"
            autocomplete="off"
          />
          <label class="filter-group">
            <span class="filter-label">Сортировка</span>
            <select class="select-input" data-filter="sort">
              <option value="name">По имени</option>
              <option value="new">Сначала новые</option>
            </select>
          </label>
          <div class="view-toggle" role="group" aria-label="Вид списка">
            <button type="button" data-view="cards">Карточки</button>
            <button type="button" data-view="table">Таблица</button>
          </div>
        </div>
      </div>
      <div class="cards-container">
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div id="results"></div>
      </div>
      <section class="submit-panel" id="submit-wrap"></section>
    </main>
    <!-- include:footer -->
    <script type="module" src="/src/pages/characters.js"></script>
  </body>
</html>
