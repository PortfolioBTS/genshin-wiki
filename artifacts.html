<!doctype html>
<html lang="ru">
  <head>
    <!-- include:head -->
    <title>Артефакты — Genshin Wiki</title>
    <meta
      name="description"
      content="Сеты артефактов Genshin Impact с бонусами за 1, 2 и 4 предмета."
    />
  </head>
  <body>
    <!-- include:header -->
    <main id="main">
      <div class="page-hero">
        <h1>💎 Артефакты</h1>
        <p>Сеты артефактов 4–5★ и их бонусы</p>
      </div>
      <div class="filter-bar">
        <div class="filter-groups" id="filter-groups"></div>
        <div class="filter-tools">
          <label class="visually-hidden" for="q">Поиск сета</label>
          <input
            class="search-input"
            id="q"
            type="search"
            placeholder="Название сета…"
            autocomplete="off"
          />
          <div class="view-toggle" role="group" aria-label="Вид списка">
            <button type="button" data-view="cards">Карточки</button>
            <button type="button" data-view="table">Таблица</button>
          </div>
        </div>
      </div>
      <div class="cards-container">
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <div id="results"></div>
      </div>
      <section class="submit-panel" id="submit-wrap"></section>
    </main>
    <!-- include:footer -->
    <script type="module" src="/src/pages/artifacts.js"></script>
  </body>
</html>
